services:
  database:
    image: postgres:16.14-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - workflowpro-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - workflowpro-minio:/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    depends_on:
      database:
        condition: service_healthy
    exclude_from_hc: true

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
      target: bootstrap
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    exclude_from_hc: true

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      TZ: Europe/Bucharest
      DATABASE_URL: ${DATABASE_URL:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-workflowpro-storage}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.7.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy

volumes:
  workflowpro-postgres:
  workflowpro-minio:
